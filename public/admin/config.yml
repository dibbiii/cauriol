# =============================================================
#  Configurazione Decap CMS — Brainy Starter
#  Per un nuovo cliente cambia SOLO la sezione "backend".
#  Ogni campo qui sotto ha un gemello in src/content.config.ts
#  o in src/lib/site.ts: se ne modifichi uno, modifica l'altro.
# =============================================================

backend:
  name: github
  repo: dibbiii/cauriol
  branch: main
  # base_url: https://auth.tuodominio.it  # solo se usi un proxy OAuth tuo (vedi README)

# In locale (npm run cms) scrive direttamente sul disco, senza login
local_backend: true

locale: it
site_url: /
display_url: /
logo_url: /favicon.svg

media_folder: public/uploads
public_folder: /uploads

collections:
  # -----------------------------------------------------------
  #  NEWS
  # -----------------------------------------------------------
  - name: news
    label: News
    label_singular: News
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Bozze, field: draft, pattern: true }
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, default: "{{now}}", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { label: Sommario, name: excerpt, widget: text, hint: "Due righe che compaiono nell'elenco news e nei motori di ricerca" }
      - { label: Immagine o locandina, name: cover, widget: image, required: false }
      - { label: Testo alternativo immagine, name: cover_alt, widget: string, required: false, hint: "Descrivi l'immagine per chi non la vede" }
      - label: Allegati
        name: attachments
        widget: list
        required: false
        summary: "{{fields.label}}"
        fields:
          - { label: Nome del file, name: label, widget: string }
          - { label: File, name: file, widget: file }
      - label: Attività collegata
        name: activity
        widget: relation
        collection: activities
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
        required: false
        hint: "Facoltativo: la news comparirà anche nella pagina di quell'attività"
      - { label: Bozza (non pubblicare), name: draft, widget: boolean, default: false, required: false }
      - { label: Testo, name: body, widget: markdown }

  # -----------------------------------------------------------
  #  PAGINE (page builder a blocchi)
  # -----------------------------------------------------------
  - name: pages
    label: Pagine
    label_singular: Pagina
    folder: src/content/pages
    create: true
    slug: "{{slug}}"
    identifier_field: title
    editor: { preview: false }
    summary: "{{title}}  (/{{slug}})"
    fields:
      - { label: Titolo, name: title, widget: string }
      - { label: Descrizione per Google, name: description, widget: text, required: false }
      - { label: Mostra il titolo in cima alla pagina, name: show_title, widget: boolean, default: true, required: false }
      - { label: Pulsanti di condivisione, name: show_share, widget: boolean, default: false, required: false, hint: "Mostra in fondo i link per condividere la pagina su X e Facebook" }
      - { label: Immagine in cima alla pagina, name: header_image, widget: image, required: false, hint: "Si vede solo se nelle Impostazioni l'intestazione è «Fascia con briciole di pane»" }
      - { label: Testo alternativo immagine in cima, name: header_image_alt, widget: string, required: false, hint: "Descrivi l'immagine per chi non la vede" }
      # &sections_field: l'elenco dei blocchi è definito qui una volta sola
      # e riusato dalle Attività con *sections_field
      - &sections_field
        label: Sezioni
        name: sections
        widget: list
        required: false
        hint: "Componi la pagina aggiungendo e riordinando le sezioni"
        types:
          - label: Copertina
            name: hero
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string }
              - { label: Sottotitolo, name: subtitle, widget: text, required: false }
              - { label: Immagine di sfondo, name: image, widget: image, required: false }
              - { label: Testo pulsante, name: button_label, widget: string, required: false }
              - { label: Link pulsante, name: button_url, widget: string, required: false }
              - { label: Altezza, name: size, widget: select, options: [{ label: Grande, value: large }, { label: Media, value: medium }], default: large }

          - label: Testo
            name: text
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Contenuto, name: content, widget: markdown }

          - label: Testo con immagine
            name: text_image
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Contenuto, name: content, widget: markdown }
              - { label: Immagine, name: image, widget: image }
              - { label: Testo alternativo, name: image_alt, widget: string, required: false }
              - { label: Immagine a, name: image_side, widget: select, options: [{ label: Destra, value: right }, { label: Sinistra, value: left }], default: right }

          - label: Schede (gare, corsi, discipline…)
            name: cards
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Introduzione, name: intro, widget: text, required: false }
              - label: Schede
                name: items
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Titolo, name: title, widget: string }
                  - { label: Dato in evidenza, name: highlight, widget: string, required: false, hint: "Es. 120 km, Under 14, Sabato 9:00" }
                  - { label: Testo, name: text, widget: text, required: false }
                  - { label: Immagine, name: image, widget: image, required: false }
                  - { label: Link, name: url, widget: string, required: false }

          - label: Elenco delle attività (discipline, gare, corsi…)
            name: activities
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Introduzione, name: intro, widget: text, required: false }
              - { label: Testo del link a destra del titolo, name: link_label, widget: string, required: false, hint: "Es. I responsabili di settore. Compare solo se compili anche il link" }
              - { label: Indirizzo del link, name: link_url, widget: string, required: false }
              - { label: Mostra i responsabili, name: show_managers, widget: boolean, default: true, required: false }

          - label: Team
            name: team
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Introduzione, name: intro, widget: text, required: false }
              - { label: Quante persone mostrare (0 = tutte), name: limit, widget: number, value_type: int, default: 0, min: 0 }
              - label: Aspetto
                name: layout
                widget: select
                default: grid
                options:
                  - { label: "Foto grande, ruolo e presentazione", value: grid }
                  - { label: "Schede centrate (es. cariche del direttivo)", value: officers }
                  - { label: "Schede compatte (es. responsabili di settore)", value: compact }
              - { label: Mostra solo il gruppo, name: group, widget: string, required: false, hint: "Lascia vuoto per mostrare tutti. Deve coincidere con il campo «Gruppo» delle persone. Es. Cariche" }

          - label: Sponsor
            name: sponsors
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Introduzione, name: intro, widget: text, required: false }

          - label: Galleria foto
            name: gallery
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - label: Foto
                name: images
                widget: list
                summary: "{{fields.caption}}"
                fields:
                  - { label: Foto, name: image, widget: image }
                  - { label: Didascalia, name: caption, widget: string, required: false }

          - label: Invito all'azione
            name: cta
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string }
              - { label: Testo, name: text, widget: text, required: false }
              - { label: Testo pulsante, name: button_label, widget: string }
              - { label: Link pulsante, name: button_url, widget: string }

          - label: Numeri
            name: stats
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - label: Aspetto
                name: layout
                widget: select
                default: row
                options:
                  - { label: "In riga, divisi da filetti", value: row }
                  - { label: "Schede separate", value: cards }
              - label: Numeri
                name: items
                widget: list
                min: 2
                max: 4
                summary: "{{fields.value}} — {{fields.label}}"
                fields:
                  - { label: Numero, name: value, widget: string, hint: "Anche con testo o zero iniziale. Es. 1947, 07, 120 km" }
                  - { label: Descrizione, name: label, widget: string, hint: "Es. Anno di fondazione" }

          - label: Periodo (linea del tempo)
            name: timeline
            widget: object
            summary: "{{fields.start}} → {{fields.end}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Dal, name: start, widget: string, hint: "Es. 19.04.2024" }
              - { label: Al, name: end, widget: string, hint: "Testo libero, non serve una data precisa. Es. primavera 2028" }

          - label: Documenti da scaricare
            name: documents
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - label: File
                name: files
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Nome, name: label, widget: string }
                  - { label: File, name: file, widget: file }
                  - { label: Anno, name: year, widget: string, required: false, hint: "Facoltativo. Es. 2024. Si vede accanto al nome e serve a ordinare" }
              - label: Ordine
                name: sort
                widget: select
                default: entered
                options:
                  - { label: "Come inseriti", value: entered }
                  - { label: "Dal più recente (per anno)", value: newest }
                  - { label: "Dal meno recente (per anno)", value: oldest }
              - { label: "Mostra anche il pulsante Apri", name: show_open, widget: boolean, default: false, required: false, hint: "Apre il file in una nuova scheda, oltre a Scarica" }

          - label: Ultime news
            name: latest_news
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, default: "Ultime news" }
              - { label: Quante news, name: count, widget: number, value_type: int, default: 3, min: 1, max: 12 }

          - label: Video YouTube
            name: video
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, required: false }
              - { label: Link del video, name: url, widget: string, hint: "Incolla il link di YouTube. Il video si carica solo dopo il clic del visitatore (GDPR)." }

          - label: Contatti
            name: contacts
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo, name: title, widget: string, default: "Contatti" }
              - { label: Introduzione, name: intro, widget: text, required: false }
              - { label: Immagine a lato, name: image, widget: image, required: false, hint: "Facoltativa. Es. il codice QR del gruppo WhatsApp" }
              - { label: Testo alternativo immagine, name: image_alt, widget: string, required: false, hint: "Descrivi l'immagine per chi non la vede. Per un QR scrivi dove porta" }
              - { label: Didascalia, name: image_caption, widget: string, required: false }

  # -----------------------------------------------------------
  #  ATTIVITÀ (discipline, gare, corsi…): un file per attività.
  #  Per un cliente cambia solo "label" (es. "Discipline", "Gare", "Corsi")
  #  e, in Impostazioni → Dati del sito, nome e indirizzo della sezione.
  # -----------------------------------------------------------
  - name: activities
    label: Attività
    label_singular: Attività
    folder: src/content/activities
    create: true
    slug: "{{slug}}"
    identifier_field: title
    editor: { preview: false }
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { label: Nome, name: title, widget: string }
      - { label: Breve descrizione, name: description, widget: text, required: false, hint: "Compare in cima alla pagina e nei motori di ricerca" }
      - { label: Immagine, name: image, widget: image, required: false, hint: "Scheda nell'elenco e immagine in cima alla pagina" }
      - { label: Testo alternativo immagine, name: image_alt, widget: string, required: false, hint: "Descrivi l'immagine per chi non la vede" }
      - label: Responsabili
        name: managers
        widget: relation
        collection: team
        search_fields: [name, role]
        value_field: "{{slug}}"
        display_fields: ["{{name}} — {{role}}"]
        multiple: true
        required: false
        hint: "Persone dell'elenco Team. Se una persona viene eliminata, sparisce da qui"
      - { label: Ordine, name: order, widget: number, value_type: int, default: 0, min: 0, required: false, hint: "Numero piccolo = prima. A parità di numero, in ordine alfabetico" }
      - *sections_field

  # -----------------------------------------------------------
  #  TEAM (una persona = un file). Il nome del file resta fisso anche se
  #  si cambia il nome: le Attività lo usano per indicare i responsabili.
  # -----------------------------------------------------------
  - name: team
    label: Team
    label_singular: Persona
    folder: src/content/team
    create: true
    slug: "{{slug}}"
    identifier_field: name
    editor: { preview: false }
    summary: "{{name}} — {{role}}"
    sortable_fields: [order, name]
    fields:
      - { label: Nome, name: name, widget: string }
      - { label: Ruolo, name: role, widget: string }
      - { label: Foto, name: photo, widget: image, required: false }
      - { label: Email, name: email, widget: string, required: false }
      - { label: Breve presentazione, name: bio, widget: text, required: false }
      - { label: Gruppo, name: group, widget: string, required: false, hint: "Facoltativo. Serve a mostrare gruppi diversi in sezioni diverse. Es. Cariche, Responsabili di settore" }
      - { label: Ordine, name: order, widget: number, value_type: int, default: 0, min: 0, required: false, hint: "Numero piccolo = prima. A parità di numero, in ordine alfabetico" }

  # -----------------------------------------------------------
  #  IMPOSTAZIONI (un file per argomento)
  # -----------------------------------------------------------
  - name: settings
    label: Impostazioni
    editor: { preview: false }
    files:
      - label: Dati del sito
        name: site
        file: src/data/site.json
        fields:
          - { label: Nome, name: name, widget: string }
          - { label: Motto, name: tagline, widget: string, required: false }
          - { label: Indirizzo del sito, name: url, widget: string, hint: "Es. https://www.esempio.it — serve per sitemap e condivisioni" }
          - { label: Logo, name: logo, widget: image, required: false }
          - { label: Mostra il nome accanto al logo, name: show_name_with_logo, widget: boolean, default: false, required: false, hint: "Se spento, con il logo caricato si vede solo il logo" }
          - { label: Sottotitolo nell'intestazione, name: header_subtitle, widget: string, required: false, hint: "Riga piccola sotto il nome. Es. ASD · Ziano di Fiemme" }
          - { label: Pulsante in evidenza — testo, name: header_button_label, widget: string, required: false, hint: "Es. Tesseramento. Compare solo se compili anche il link" }
          - { label: Pulsante in evidenza — link, name: header_button_url, widget: string, required: false }
          - label: Intestazione delle pagine interne
            name: page_header_style
            widget: select
            required: false
            default: simple
            hint: "Vale per tutte le pagine tranne la home. La fascia mostra briciole di pane, titolo, descrizione e, se caricata, un'immagine."
            options:
              - { label: "Semplice (solo il titolo)", value: simple }
              - { label: "Fascia con briciole di pane e descrizione", value: band }
          - { label: Immagine per condivisioni social, name: og_image, widget: image, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Telefono, name: phone, widget: string, required: false }
          - { label: Indirizzo, name: address, widget: text, required: false }
          - { label: Codice fiscale / P.IVA, name: tax_id, widget: string, required: false }
          - label: Social
            name: socials
            widget: list
            required: false
            summary: "{{fields.platform}}"
            fields:
              - { label: Piattaforma, name: platform, widget: select, options: [Facebook, Instagram, YouTube, Strava, LinkedIn, TikTok, Altro] }
              - { label: Link, name: url, widget: string }
          - { label: Link informativa privacy, name: privacy_url, widget: string, default: "/privacy" }
          - { label: Testo a piè di pagina, name: footer_note, widget: text, required: false }
          - { label: Logo nel piè di pagina, name: footer_logo, widget: image, required: false, hint: "Versione chiara del logo, perché il fondo è scuro. Se vuoto si vede il nome del sito" }
          - label: Colonne di link nel piè di pagina
            name: footer_columns
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Titolo della colonna, name: title, widget: string }
              - { label: "Aggiungi l'elenco delle attività", name: from_activities, widget: boolean, default: false, required: false, hint: "Dopo i link scritti a mano, aggiunge in automatico tutte le attività" }
              - label: Link
                name: links
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Testo, name: label, widget: string }
                  - { label: Link, name: url, widget: string }
          - { label: "Attività: nome della sezione (plurale)", name: activities_label, widget: string, default: "Attività", required: false, hint: "Es. Discipline, Gare, Corsi. Compare nelle briciole di pane e nei titoli" }
          - { label: "Attività: indirizzo della sezione", name: activities_path, widget: string, default: "attivita", required: false, hint: "Es. discipline → le pagine saranno /discipline/nome. Solo minuscole e trattini" }
          - { label: "Attività: titolo «Altre…»", name: activities_more_title, widget: string, default: "Altre attività", required: false, hint: "Sotto ogni pagina di dettaglio. Es. Altre discipline / Altri corsi" }
          - { label: "Attività: link a tutte", name: activities_all_label, widget: string, default: "Tutte le attività", required: false, hint: "Es. Tutte le discipline / Tutti i corsi" }
          - { label: "Mostra le altre pagine della sezione", name: show_section_nav, widget: boolean, default: false, required: false, hint: "In fondo alle pagine che nel menu stanno dentro un sottomenu (es. La società), mostra le altre pagine di quel sottomenu" }
          - { label: "Pulsanti di condivisione su news e attività", name: show_share_links, widget: boolean, default: false, required: false, hint: "Link per condividere su X e Facebook, senza script né cookie. Per le pagine normali si attiva pagina per pagina" }
          - { label: "News: prima news in evidenza", name: news_featured, widget: boolean, default: false, required: false, hint: "Nell'elenco la news più recente appare grande, in cima" }
          - { label: "News: colonna laterale", name: news_sidebar, widget: boolean, default: false, required: false, hint: "Nella pagina di una news mostra a fianco le altre news" }
          - { label: "News: riquadro nella colonna — titolo", name: news_box_title, widget: string, required: false, hint: "Facoltativo, si vede solo con la colonna laterale. Es. Tesseramento" }
          - { label: "News: riquadro nella colonna — testo", name: news_box_text, widget: text, required: false }
          - { label: "News: riquadro nella colonna — testo pulsante", name: news_box_button_label, widget: string, required: false }
          - { label: "News: riquadro nella colonna — link pulsante", name: news_box_button_url, widget: string, required: false }

      - label: Aspetto
        name: theme
        file: src/data/theme.json
        fields:
          - { label: Colore principale, name: primary, widget: color }
          - { label: "Colore accento (segnavia e pulsanti)", name: accent, widget: color }
          - { label: Colore testo, name: ink, widget: color }
          - { label: Colore sfondo, name: paper, widget: color }
          - label: Carattere titoli
            name: heading_font
            widget: select
            options:
              - { label: "Barlow Condensed (sportivo)", value: barlow }
              - { label: "Archivo (moderno)", value: archivo }
              - { label: "Fraunces (elegante)", value: fraunces }
              - { label: "Source Serif 4 (editoriale)", value: source_serif }
          - label: Carattere testo
            name: body_font
            widget: select
            options:
              - { label: "Source Sans (neutro)", value: source }
              - { label: "Atkinson Hyperlegible (massima leggibilità)", value: atkinson }
              - { label: "Lora (classico)", value: lora }
          - label: Angoli
            name: corners
            widget: select
            options:
              - { label: Squadrati, value: square }
              - { label: Leggermente arrotondati, value: soft }

      - label: Menu
        name: menu
        file: src/data/menu.json
        fields:
          - label: Voci
            name: items
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Etichetta, name: label, widget: string }
              - { label: Link, name: url, widget: string, required: false, hint: "Es. /chi-siamo oppure https://… Lascia vuoto se la voce ha solo un sottomenu" }
              - { label: "Mostra le attività come sottomenu", name: activities_submenu, widget: boolean, default: false, required: false, hint: "Aggiunge in automatico, sotto questa voce, tutte le attività (discipline, gare, corsi…)" }
              - label: Sottomenu
                name: children
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Etichetta, name: label, widget: string }
                  - { label: Link, name: url, widget: string }

      - label: Sponsor
        name: sponsors
        file: src/data/sponsors.json
        fields:
          - label: Sponsor
            name: items
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Nome, name: name, widget: string }
              - { label: Logo, name: logo, widget: image, required: false }
              - { label: Sito, name: url, widget: string, required: false }
              - label: Livello
                name: tier
                widget: select
                default: partner
                options:
                  - { label: Principale, value: main }
                  - { label: Partner, value: partner }
                  - { label: Istituzionale, value: institutional }
          - { label: Mostra gli sponsor nel piè di pagina, name: show_in_footer, widget: boolean, default: true }
